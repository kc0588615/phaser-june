name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Drizzle only: Supabase and Prisma were migrated out (also blocked for agent edits by .claude/hooks/guard-edits.sh).
      - name: No Supabase/Prisma
        run: |
          ! git grep -nIE '@supabase|supabase\.co|@prisma|schema\.prisma' -- src scripts tests db package.json
      # A Prisma schema names no package, so check file names too. Own step: `bash -e` doesn't stop on a `!` command.
      - name: No Prisma schema files
        run: |
          ! git ls-files '*.prisma' | grep .
      # The legal and teacher pages live only on the website (plan 051, owner 2026-10-29): no play.-relative links to them
      # from the game. Matches a quoted or bracketed path or a play. URL, not the bare words.
      - name: No game links to site pages
        run: |
          ! git grep -nIE "(['\"\`(]|play\.critterconnect\.org)/(privacy|terms|teachers)\b" -- src ':!src/site'
      - run: npm test
      # The website (plan 051): static files for critterconnect.org.
      - run: npm run site:build
      # Its Caddy image (Docker isn't on the agents' VPS, so CI proves it): the Caddyfile is valid and the site is in.
      - run: docker build --target caddy -t cc-caddy .
      - run: docker run --rm -e APP_DOMAIN=play.critterconnect.org cc-caddy sh -c 'caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile && test -f /srv/site/index.html'
      # The website in a browser (scripts/e2e-site.mjs), on the out/site built above; Chrome is the runner's
      # /usr/bin/google-chrome. In `check` on purpose: the release waits for this job.
      - name: Website browser test
        run: |
          mkdir -p e2e-artifacts
          npm run site:serve > e2e-artifacts/site-serve.log 2>&1 &
          timeout 30 bash -c 'until curl -fs -o /dev/null http://127.0.0.1:3101/; do sleep 1; done'
          npm run e2e:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-site
          path: e2e-artifacts/
          retention-days: 7
      # Typecheck + production build. The build loads route modules but never queries.
      - run: npm run build
        env:
          DATABASE_URL: postgres://build@127.0.0.1:1/build
          NEXT_TELEMETRY_DISABLED: 1

  # Plays the game in headless Chrome against the scrubbed copy phaser_june_dev, so CI holds no live database
  # credentials (docs/DATABASE_ACCESS.md).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e:fresh
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: |
            e2e-artifacts/
            .next-e2e/server.log
          include-hidden-files: true
          retention-days: 7
