name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Drizzle only: Supabase and Prisma were migrated out (also blocked for agent edits by .claude/hooks/guard-edits.sh).
      - name: No Supabase/Prisma
        run: |
          ! git grep -nIE '@supabase|supabase\.co|@prisma|schema\.prisma' -- src scripts tests db package.json
      # The legal and teacher pages live only on the website (plan 051, owner 2026-10-29): no play.-relative links to them
      # from the game. Matches a quoted or bracketed path or a play. URL, not the bare words.
      - name: No game links to site pages
        run: |
          ! git grep -nIE "(['\"\`(]|play\.critterconnect\.org)/(privacy|terms|teachers)\b" -- src ':!src/site'
      - run: npm test
      # The website (plan 051): static files for critterconnect.org.
      - run: npm run site:build
      # Its Caddy image (Docker isn't on the agents' VPS, so CI proves it): the Caddyfile is valid and the site is in.
      - run: docker build --target caddy -t cc-caddy .
      - run: docker run --rm -e APP_DOMAIN=play.critterconnect.org cc-caddy sh -c 'caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile && test -f /srv/site/index.html'
      # Typecheck + production build. The build loads route modules but never queries, and needs no Clerk keys.
      - run: npm run build
        env:
          DATABASE_URL: postgres://build@127.0.0.1:1/build
          NEXT_TELEMETRY_DISABLED: 1

  # Plays the game in headless Chrome. It writes rounds to clue_match_solves, so it uses the scrubbed copy
  # phaser_june_dev, never the live database (docs/DATABASE_ACCESS.md). Next dev needs both keys of Clerk's dev instance.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e:fresh
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: |
            e2e-artifacts/
            .next-e2e/server.log
          include-hidden-files: true
          retention-days: 7
