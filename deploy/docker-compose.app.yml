# The web app and its HTTPS front door, as its own stack that joins the
# database stack's network (reaches Postgres as `db`). From the repo root:
#   docker compose -f deploy/docker-compose.app.yml --project-directory . up -d --build
# Needs deploy/app.env (from deploy/app.env.example) and, in .env, APP_DOMAIN,
# the build-time NEXT_PUBLIC_* values and DB_NETWORK if not postgis_backend.
name: critter
services:
  app:
    build:
      context: .
      target: run
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    container_name: critter-app
    restart: unless-stopped
    env_file: deploy/app.env
    expose:
      - "8080"
    networks:
      - backend
      - web

  # Automatic HTTPS (Let's Encrypt) for APP_DOMAIN, proxying to the app, and the website at
  # critterconnect.org (plan 051 §10). Its image holds deploy/Caddyfile and the site's files (Dockerfile,
  # stage caddy), so `up -d` recreates it only when either changed.
  caddy:
    build:
      context: .
      target: caddy
    container_name: caddy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - web

networks:
  backend:
    external: true
    name: ${DB_NETWORK:-postgis_backend}
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
