# The database stack (PostGIS and PgBouncer), as the repo's reference copy. The server runs its own copy,
# /opt/postgis/docker-compose.yml with /opt/postgis/.env (compose project `postgis`, so its network is the
# postgis_backend that deploy/docker-compose.app.yml joins). No deploy touches that copy: deploy/deploy.sh runs
# deploy/docker-compose.app.yml only. The two are not compared by an agent: see handoff H16 (the owner compares them).
# A change reaches the server by hand: take a fresh dump (deploy/backup/pg-backup.sh on the server), make the same
# edit in /opt/postgis/docker-compose.yml, then run `docker compose up -d --no-deps <service>` there
# (docs/DATABASE_ACCESS.md#runbook, step 3).
# PgBouncer's certificate mount below doesn't work as written on a fresh server: certbot's live/<DB_DOMAIN> files are
# symlinks into ../../archive/, outside the mount. How the server's copy reads them, and what restarts PgBouncer after
# a renewal, is the owner's to say: see handoff H17.
services:
  # PostgreSQL + PostGIS
  db:
    image: postgis/postgis:17-3.5
    container_name: postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-phaser_june}
    volumes:
      # Production: use Hetzner Volume path (must exist + be writable by UID 999)
      - ${PGDATA_PATH:-./pgdata}:/var/lib/postgresql/data
      # Init scripts run ONCE on first start (empty data dir). Extensions only.
      - ./init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-phaser_june}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Connection pooler (public, with TLS)
  pgbouncer:
    image: edoburu/pgbouncer@sha256:85d1e38593617af1b5f7f285e97d407e56c29939683cc7cfe4c8f6dc19f1268b  # what the server ran on 2026-11-15; no tag has this digest now
    container_name: pgbouncer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # One [databases] entry per URL: prod, and the scrubbed copy phaser_june_dev
      # (CI's e2e database; docs/DATABASE_ACCESS.md#agents-on-the-oracle-vps). Other roles log in via
      # auth_user. The ini is written only on a fresh container: `up -d`, not `restart`.
      DATABASE_URLS: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-phaser_june},postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/phaser_june_dev"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      LISTEN_ADDR: "*"
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      # TLS for public exposure
      CLIENT_TLS_SSLMODE: require
      CLIENT_TLS_KEY_FILE: /etc/pgbouncer/certs/privkey.pem
      CLIENT_TLS_CERT_FILE: /etc/pgbouncer/certs/fullchain.pem
    ports:
      - "6432:6432"
    volumes:
      # Mount Let's Encrypt certs (created by certbot on host)
      - /etc/letsencrypt/live/${DB_DOMAIN:-db.critterconnect.org}:/etc/pgbouncer/certs:ro
    networks:
      - backend

networks:
  backend:
    driver: bridge
